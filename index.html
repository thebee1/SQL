<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#ffffff">
<title>SQL Quest — Apprends SQL en jouant</title>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.2/dist/sql-wasm.js"></script>
<style>
:root{
  --bg:#fff;--bg2:#f4f6fb;--card:#fff;--card2:#f1f5f9;
  --border:#e2e8f0;--border-strong:#cbd5e1;
  --text:#1e293b;--muted:#64748b;
  --accent:#7c5cff;--accent2:#0ea5e9;--gold:#f59e0b;
  --green:#16a34a;--red:#dc2626;--code:#f8fafc;--code-text:#1e293b;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  background:linear-gradient(180deg,#fff 0%,#f4f6fb 60%,#eef1f8 100%);
  background-attachment:fixed;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;line-height:1.55;overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;
}
code,pre,.mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
a{color:var(--accent2)}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:inherit}
#topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 22px;padding-top:calc(12px + var(--safe-top));
  padding-left:calc(22px + var(--safe-left));padding-right:calc(22px + var(--safe-right));
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.logo{font-weight:800;font-size:1.15rem;letter-spacing:-.5px;white-space:nowrap;color:#1e293b}
.logo span{color:var(--accent)}
.stat{display:flex;align-items:center;gap:6px;font-size:.9rem;font-weight:600;color:#334155}
.stat .val{color:var(--gold)}
.xpwrap{flex:1;max-width:280px;margin-left:auto;min-width:140px}
.xpmeta{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-bottom:4px}
.xpbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.xpfill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .5s}
.btn-icon{background:#fff;border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:10px;cursor:pointer;font-size:1rem;transition:.15s;
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}
.btn-icon:active{background:var(--accent);color:#fff}
.btn-icon.off{opacity:.4}
.btn-reset{background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:8px 12px;border-radius:10px;cursor:pointer;font-size:.8rem;min-height:44px}
.btn-reset:hover{border-color:var(--red);color:var(--red)}
#app{max-width:1080px;margin:0 auto;padding:34px 22px;
  padding-left:calc(22px + var(--safe-left));padding-right:calc(22px + var(--safe-right));
  padding-bottom:calc(80px + var(--safe-bottom))}
.hero{text-align:center;margin-bottom:40px}
.hero h1{font-size:2.4rem;letter-spacing:-1.5px;margin-bottom:10px;color:#0f172a}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:560px;margin:0 auto}
.world{background:#fff;border:1px solid var(--border);border-radius:18px;
  padding:22px;margin-bottom:22px;transition:.2s;
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03)}
.world.clickable{cursor:pointer}
.world.clickable:hover{transform:translateY(-2px);border-color:var(--accent);
  box-shadow:0 4px 12px rgba(124,92,255,.12),0 8px 24px rgba(0,0,0,.06)}
.world.locked{opacity:.55}
.world-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.world-emoji{font-size:1.9rem}
.world-title{font-size:1.25rem;font-weight:700;color:#0f172a}
.world-desc{color:var(--muted);font-size:.85rem}
.world-prog{margin-left:auto;text-align:right;font-size:.8rem;color:var(--muted)}
.world-prog b{color:var(--accent2);font-size:1.05rem}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:18px}
.lesson{background:var(--card2);border:1px solid var(--border);border-radius:12px;
  padding:16px;cursor:pointer;transition:.18s;position:relative;min-height:68px;
  display:flex;flex-direction:column;justify-content:center}
.lesson:hover:not(.locked){transform:translateY(-3px);border-color:var(--accent);
  background:#fff;box-shadow:0 8px 24px rgba(124,92,255,.15)}
.lesson.locked{opacity:.45;cursor:not-allowed}
.lesson.done{border-color:rgba(22,163,74,.4);background:#f0fdf4}
.lesson-name{font-weight:600;font-size:.92rem;margin-bottom:6px;color:#0f172a}
.lesson-stars{font-size:.85rem;letter-spacing:2px;color:var(--gold)}
.lesson-idx{position:absolute;top:12px;right:14px;font-size:.7rem;color:var(--muted)}
.badges-sec{margin-top:40px}
.badges-sec h2{font-size:1.1rem;margin-bottom:14px;color:#0f172a}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;font-size:.82rem;display:flex;gap:8px;align-items:center;color:#334155}
.badge.off{opacity:.35;filter:grayscale(1)}
.badge.on{border-color:var(--gold);background:#fffbeb;
  box-shadow:0 0 16px rgba(245,158,11,.15);color:#92400e}
.back{background:#fff;border:1px solid var(--border);color:var(--text);
  padding:10px 18px;border-radius:10px;cursor:pointer;font-size:.9rem;
  margin-bottom:22px;transition:.15s;min-height:44px;
  display:inline-flex;align-items:center;gap:6px}
.back:hover{border-color:var(--accent);color:var(--accent)}
.theory{background:#fff;border:1px solid var(--border);border-radius:16px;
  padding:22px 24px;margin-bottom:22px;position:relative;
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03)}
.theory h2,.theory h3{font-size:1.3rem;margin-bottom:14px;color:#0f172a;padding-right:44px}
.theory h3{font-size:1.1rem}
.theory p{margin-bottom:10px;color:#334155;font-size:.93rem}
.theory ul,.theory ol{margin:0 0 12px 20px;color:#334155;font-size:.93rem}
.theory li{margin-bottom:6px}
.theory strong{color:#0f172a}
.theory code{background:#eef2ff;padding:2px 7px;border-radius:5px;
  color:#4338ca;font-size:.85em;font-weight:500;word-break:break-word}
.theory pre{background:var(--code);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;overflow-x:auto;margin-bottom:12px;font-size:.85rem;
  color:var(--code-text);line-height:1.6;-webkit-overflow-scrolling:touch}
.speak-fab{position:absolute;top:16px;right:16px;background:#fff;border:1px solid var(--border);
  color:var(--accent);width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;transition:.15s;
  box-shadow:0 1px 3px rgba(0,0,0,.06);z-index:2}
.speak-fab:hover{background:var(--accent);color:#fff}
.speak-fab.speaking{background:var(--accent);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,92,255,.6)}50%{box-shadow:0 0 0 8px rgba(124,92,255,0)}}
.ex-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ex-head strong{color:#0f172a}
.ex-dots{display:flex;gap:7px;margin-left:auto}
.dot{width:11px;height:11px;border-radius:50%;background:#fff;border:1.5px solid var(--border-strong)}
.dot.cur{border-color:var(--accent);background:rgba(124,92,255,.15);box-shadow:0 0 10px var(--accent)}
.dot.ok{background:var(--green);border-color:var(--green)}
.prompt{font-size:1.02rem;margin-bottom:16px;font-weight:500;padding-right:56px;color:#0f172a}
.prompt b{color:#4338ca}
.prompt code{background:#eef2ff;padding:2px 7px;border-radius:5px;color:#4338ca;
  font-size:.88em;font-weight:500;word-break:break-word}
.editor-wrap{position:relative;margin-bottom:14px}
textarea#editor{width:100%;min-height:120px;resize:vertical;background:#fafbfc;
  color:var(--code-text);border:1px solid var(--border);border-radius:12px;
  padding:16px 16px 16px 46px;font-family:'JetBrains Mono',Consolas,monospace;
  font-size:16px;line-height:1.65;outline:none;transition:.18s;
  -webkit-appearance:none;appearance:none}
textarea#editor:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(124,92,255,.15)}
.lineno{position:absolute;left:0;top:0;bottom:0;width:38px;background:#f1f5f9;
  border-right:1px solid var(--border);border-radius:12px 0 0 12px;
  display:flex;flex-direction:column;align-items:center;padding-top:16px;
  font-size:.72rem;color:#94a3b8;font-family:'JetBrains Mono',monospace;gap:1px;pointer-events:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{border:none;border-radius:10px;padding:12px 20px;font-size:.9rem;font-weight:600;
  cursor:pointer;transition:.15s;font-family:inherit;min-height:48px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-run{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-run:hover:not(:disabled){border-color:var(--accent2);color:var(--accent2);background:#f0f9ff}
.btn-check{background:linear-gradient(135deg,var(--accent),#5b3fd6);color:#fff;
  box-shadow:0 2px 8px rgba(124,92,255,.25)}
.btn-hint{background:transparent;color:#b45309;border:1px solid rgba(245,158,11,.4)}
.btn-hint:hover:not(:disabled){background:#fffbeb}
.btn-next{background:var(--green);color:#fff}
.feedback{border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:.9rem;display:none}
.feedback.show{display:block}
.feedback.ok{background:#dcfce7;border:1px solid #86efac;color:#166534}
.feedback.err{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.feedback.info{background:#ede9fe;border:1px solid #c4b5fd;color:#5b21b6}
.hintbox{border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:.88rem;
  background:#fef3c7;border:1px solid #fcd34d;color:#92400e;display:none}
.hintbox.show{display:block}
.results{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;
  display:none;background:#fff}
.results.show{display:block}
.results-bar{background:var(--card2);padding:8px 14px;font-size:.75rem;color:var(--muted);
  display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}
.table-scroll{overflow-x:auto;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:#f1f5f9;text-align:left;padding:9px 14px;color:#4338ca;font-weight:600;
  position:sticky;top:0;border-bottom:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;font-size:.78rem;white-space:nowrap}
td{padding:8px 14px;border-bottom:1px solid #f1f5f9;
  font-family:'JetBrains Mono',monospace;color:#334155;white-space:nowrap}
td.null{color:#94a3b8;font-style:italic}
.complete{text-align:center;padding:50px 20px}
.complete .big{font-size:4rem;margin-bottom:16px;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.complete h2{font-size:1.6rem;margin-bottom:10px;color:#0f172a}
.complete .stars{font-size:2rem;color:var(--gold);letter-spacing:6px;margin:14px 0}
.complete p{color:var(--muted);margin-bottom:24px}
#loader{position:fixed;inset:0;background:#fff;z-index:999;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:20px}
.spinner{width:44px;height:44px;border:3px solid var(--card2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{color:var(--muted);font-size:.9rem}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);padding-top:calc(20px + var(--safe-top));
  padding-bottom:calc(20px + var(--safe-bottom))}
.modal{background:#fff;border:1px solid var(--border);border-radius:16px;max-width:640px;
  width:100%;max-height:80vh;overflow-y:auto;padding:26px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);-webkit-overflow-scrolling:touch}
.modal h3{margin-bottom:16px;color:#0f172a}
.modal pre{background:var(--code);border:1px solid var(--border);padding:14px;
  border-radius:10px;font-size:.8rem;overflow-x:auto;color:var(--code-text);margin-bottom:12px}
.modal .btn{margin-top:10px;width:100%}
#toast{position:fixed;bottom:calc(26px + var(--safe-bottom));left:50%;
  transform:translateX(-50%) translateY(100px);background:#1e293b;border:1px solid var(--gold);
  color:#fbbf24;padding:12px 24px;border-radius:12px;font-size:.88rem;font-weight:600;
  transition:.35s;z-index:200;opacity:0;pointer-events:none;
  box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.opt-btn{background:#fff;border:1px solid var(--border);color:var(--text);
  padding:16px 18px;border-radius:12px;text-align:left;cursor:pointer;font-size:.95rem;
  font-family:inherit;transition:.15s;width:100%;margin-bottom:10px;display:block;
  min-height:56px;line-height:1.4}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#f5f3ff}
.opt-btn:disabled{cursor:not-allowed}
.opt-btn.correct{background:#dcfce7;border-color:var(--green);color:#166534}
.opt-btn.wrong{background:#fee2e2;border-color:var(--red);color:#991b1b}
.quiz-sql{background:var(--code);border:1px solid var(--border);border-radius:12px;
  padding:16px;font-family:'JetBrains Mono',monospace;font-size:.85rem;
  color:var(--code-text);margin-bottom:18px;white-space:pre-wrap;
  overflow-x:auto;line-height:1.6;word-break:break-word}
.timer{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:700;color:#b45309}
.timer.warn{color:var(--red);animation:pulse .5s infinite}
.score-big{font-size:3rem;font-weight:800;color:var(--accent);margin:14px 0}
@keyframes ttsPulse{0%,100%{box-shadow:0 0 0 0 rgba(124,92,255,.4)}50%{box-shadow:0 0 0 6px rgba(124,92,255,0)}}
#test-audio-btn:not(.off){animation:ttsPulse 2.5s infinite}
/* Academy styles */
.chapter-card{background:#fff;border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;margin-bottom:14px;cursor:pointer;transition:.2s;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}
.chapter-card:hover{border-color:var(--accent);transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(124,92,255,.12)}
.chapter-head{display:flex;align-items:center;gap:14px}
.chapter-num{width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),#5b3fd6);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;flex-shrink:0}
.chapter-info{flex:1;min-width:0}
.chapter-title{font-weight:700;font-size:1rem;color:#0f172a;margin-bottom:2px}
.chapter-summary{font-size:.82rem;color:var(--muted)}
.chapter-progress{font-size:.78rem;color:var(--accent2);font-weight:600;white-space:nowrap}
.tp-item{background:#f8fafc;border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;margin-bottom:12px;transition:.15s}
.tp-item.done{background:#f0fdf4;border-color:rgba(22,163,74,.3)}
.tp-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.tp-check{width:24px;height:24px;border:2px solid var(--border-strong);border-radius:6px;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:#fff;transition:.15s;font-size:.85rem;color:transparent;margin-top:2px}
.tp-check:hover{border-color:var(--accent)}
.tp-check.done{background:var(--green);border-color:var(--green);color:#fff}
.tp-prompt{flex:1;font-size:.93rem;color:#0f172a;font-weight:500}
.tp-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tp-actions .btn{padding:8px 14px;font-size:.8rem;min-height:40px}
.tp-solution{background:var(--code);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:.82rem;
  color:var(--code-text);white-space:pre-wrap;margin-top:10px;display:none;
  line-height:1.6;word-break:break-word}
.tp-solution.show{display:block}
.tp-hintbox{background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;
  padding:10px 14px;font-size:.83rem;color:#92400e;margin-top:10px;display:none}
.tp-hintbox.show{display:block}
@media(max-width:768px){
  #topbar{padding:10px 14px;padding-top:calc(10px + var(--safe-top));
    padding-left:calc(14px + var(--safe-left));padding-right:calc(14px + var(--safe-right));gap:8px}
  .logo{font-size:1rem}
  .stat{font-size:.82rem}
  .btn-icon,.btn-reset{min-height:40px;padding:6px 10px}
  .xpwrap{order:10;width:100%;max-width:100%;margin-left:0;margin-top:2px}
  #app{padding:20px 14px;padding-left:calc(14px + var(--safe-left));
    padding-right:calc(14px + var(--safe-right));
    padding-bottom:calc(100px + var(--safe-bottom))}
  .hero h1{font-size:1.75rem}
  .world{padding:16px;border-radius:14px}
  .world-title{font-size:1.1rem}
  .lessons{grid-template-columns:1fr}
  .theory{padding:16px 18px}
  textarea#editor{font-size:16px;min-height:140px}
  .actions{position:sticky;bottom:0;background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px);padding:10px 0;margin:0 0 16px;
    border-top:1px solid var(--border);z-index:10;gap:8px}
  .actions .btn{flex:1 1 calc(50% - 4px);padding:12px 14px;font-size:.85rem}
  .actions .btn:only-child,.actions .btn-next{flex:1 1 100%}
  .speak-fab{width:40px;height:40px;font-size:1rem;top:14px;right:14px}
  .opt-btn{padding:16px;font-size:.92rem;min-height:60px}
  .chapter-card{padding:14px 16px}
  .chapter-num{width:38px;height:38px;font-size:1rem}
  .chapter-title{font-size:.95rem}
  .tp-item{padding:14px}
  .tp-actions .btn{flex:1 1 calc(50% - 4px);font-size:.78rem;padding:10px 12px}
  .modal{padding:20px}
  #toast{font-size:.82rem;padding:10px 18px;max-width:calc(100vw - 32px)}
}
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <p>Chargement du moteur SQL…</p>
</div>

<header id="topbar">
  <div class="logo">SQL<span>Quest</span></div>
  <div class="stat">🔥 <span class="val" id="s-streak">0</span></div>
  <div class="stat">⭐ <span class="val" id="s-xp">0</span> XP</div>
  <div class="stat">🏅 <span class="val" id="s-level">1</span></div>
  <div class="xpwrap">
    <div class="xpmeta"><span id="xp-lvl-label">Niveau 1</span><span id="xp-next-label">0 / 100</span></div>
    <div class="xpbar"><div class="xpfill" id="xp-fill"></div></div>
  </div>
  <button class="btn-icon" id="test-audio-btn" onclick="testAudio()" title="Tester le son">🔔</button>
  <button class="btn-icon" id="tts-btn" onclick="toggleTTS()" title="Voix">🔊</button>
  <button class="btn-reset" onclick="resetProgress()">Reset</button>
</header>

<main id="app"></main>
<div id="toast"></div>

<script>
/* =========================================================
   DATASETS
   ========================================================= */
const DB_SQL = `
CREATE TABLE products (
  id INTEGER PRIMARY KEY, name TEXT NOT NULL, category TEXT NOT NULL,
  price REAL NOT NULL, stock INTEGER NOT NULL
);
INSERT INTO products VALUES
(1,'Laptop Pro','Informatique',1299.99,15),(2,'Souris sans fil','Informatique',29.99,120),
(3,'Clavier mécanique','Informatique',89.50,60),(4,'Écran 27 pouces','Informatique',349.00,25),

{id:'ch5',emoji:'5️⃣',title:'GROUP BY & HAVING',

 <p><strong>WHERE</strong> filtre les lignes AVANT. <strong>HAVING</strong> filtre les groupes APRÈS.</p>
 <p>Ordre d'exécution : <code>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</code></p>
 <p>⚠️ Dans <code>SELECT</code>, uniquement colonnes du GROUP BY + agrégats.</p>

const SAVE_KEY = 'sqlquest_v1';
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      s.ex=s.ex||{};s.lessons=s.lessons||{};s.badges=s.badges||[];
      s.streak=s.streak||{count:0,last:null};s.xp=s.xp||0;
      s.scores=s.scores||{quiz:0,bug:0,output:0,speed:0};
      s.academy=s.academy||{};
      s.tts=s.tts!==false;
      return s;
    }
  }catch(e){}
  return {xp:0,ex:{},lessons:{},badges:[],streak:{count:0,last:null},
          scores:{quiz:0,bug:0,output:0,speed:0},academy:{},tts:true};
}
function saveState(){ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
function touchStreak(){
  const t=todayStr();
  if(state.streak.last===t) return;
  state.streak.count = (state.streak.last===yesterdayStr()) ? state.streak.count+1 : 1;
  state.streak.last = t;
  saveState();
  if(state.streak.count>=2) toast('🔥 Série de ' + state.streak.count + ' jours !');
}
function totalSolved(){ return Object.keys(state.ex).length; }
function lessonDone(id){
  const l=findLesson(id);
  return l.exercises.every((_,i)=> state.ex[id+':'+i]!==undefined);
}
function worldDone(wid){
  const w=CURRICULUM.find(w=>w.id===wid);
  return w.lessons.every(l=>lessonDone(l.id));
}
function allDone(){ return CURRICULUM.every(w=>worldDone(w.id)); }
function findLesson(id){
  for(const w of CURRICULUM) for(const l of w.lessons) if(l.id===id) return l;
  return null;
}
function lessonStars(id){
  const l=findLesson(id); let sum=0,n=0;
  l.exercises.forEach((_,i)=>{ const st=state.ex[id+':'+i]; if(st!==undefined){sum+=st;n++;} });
  return n ? Math.round(sum/n) : 0;
}
function levelInfo(){
  const lvl=Math.floor(state.xp/100)+1;
  const base=(lvl-1)*100;
  return {level:lvl,into:state.xp-base,need:100,pct:Math.min(100,((state.xp-base)/100)*100)};
}
function chapterTpDone(chId){
  const ch=ACADEMY.find(c=>c.id===chId);
  return ch.tps.filter((_,i)=> state.academy[chId+':'+i]).length;
}

let ttsVoice=null, ttsUnlocked=false;
function initTTS(){
  if(!('speechSynthesis' in window)) return;
  const loadVoices=()=>{
    const voices=window.speechSynthesis.getVoices();
    if(!voices.length) return;
    ttsVoice = voices.find(v=>v.lang==='fr-FR') || voices.find(v=>v.lang.startsWith('fr')) || null;
  };
  loadVoices();
  if('onvoiceschanged' in window.speechSynthesis) window.speechSynthesis.onvoiceschanged = loadVoices;
  const unlock=()=>{
    if(ttsUnlocked) return;
    try{
      const u=new SpeechSynthesisUtterance('.');
      u.volume=0.01; u.rate=10; u.lang='fr-FR';
      if(ttsVoice) u.voice=ttsVoice;
      window.speechSynthesis.speak(u);
      ttsUnlocked=true;
    }catch(e){}
  };
  ['click','touchstart','touchend','pointerdown','keydown'].forEach(evt=>{
    document.addEventListener(evt, unlock, {once:true,passive:true});
  });
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && 'speechSynthesis' in window){
      try{ window.speechSynthesis.resume(); }catch(e){}
    }
  });
}
function unlockTTS(){ /* no-op, géré globalement */ }
function speak(text, opts={}){
  if(!state.tts || !('speechSynthesis' in window)) return;
  const clean = String(text).replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/gi,' ').replace(/\s+/g,' ').trim();
  if(!clean) return;
  try{
    if(window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
    const doSpeak=()=>{
      try{
        const u=new SpeechSynthesisUtterance(clean);
        u.lang='fr-FR'; u.rate=opts.rate||1; u.volume=1;
        if(ttsVoice) u.voice=ttsVoice;
        u.onerror=(e)=>{
          if(e.error==='not-allowed'){
            ttsUnlocked=false;
            toast('🔇 Touche l\'écran pour activer le son');
          }
        };
        window.speechSynthesis.resume();
        window.speechSynthesis.speak(u);
      }catch(e){}
    };
    if(!ttsUnlocked){ doSpeak(); ttsUnlocked=true; }
    else setTimeout(doSpeak, 60);
  }catch(e){}
}
function toggleTTS(){
  state.tts = !state.tts;
  if(!state.tts && 'speechSynthesis' in window) window.speechSynthesis.cancel();
  saveState();
  updateTopbar();
  toast(state.tts ? '🔊 Voix activée' : '🔇 Voix désactivée');
  if(state.tts) testAudio();
}
function speakEl(sel){
  if(!state.tts){ toast('🔇 Voix désactivée'); return; }
  const el=document.querySelector(sel);
  if(!el) return;
  speak(el.textContent);
  const btn=document.querySelector(`[data-speak="${sel}"]`);
  if(btn){ btn.classList.add('speaking'); setTimeout(()=>btn.classList.remove('speaking'), 1500); }
}
function testAudio(){
  if(!state.tts){ toast('🔇 Active la voix avec 🔊'); return; }
  if(!('speechSynthesis' in window)){ alert('❌ Pas de synthèse vocale sur ce navigateur.'); return; }
  const voices=window.speechSynthesis.getVoices();
  if(!voices.length){ toast('⏳ Chargement des voix… réessaie dans 2s'); return; }
  if(!voices.find(v=>v.lang.startsWith('fr'))){
    alert('⚠️ Aucune voix française installée.\n\n' +
      'Android : Paramètres → Langue → Synthèse vocale → Français\n' +
      'iOS : Réglages → Accessibilité → Contenu énoncé → Voix → Français');
    return;
  }
  speak('Bonjour ! Je suis ta guide SQL Quest. Si tu entends ce message, tout fonctionne correctement.');
  toast('🔊 Test audio en cours…');
}

/* =========================================================
   SQL ENGINE
   ========================================================= */
let db=null, expectedCache={};
async function initDB(){
  const SQL = await initSqlJs({ locateFile: f => 'https://cdn.jsdelivr.net/npm/sql.js@1.10.2/dist/' + f });
  db = new SQL.Database();
  db.run(DB_SQL);
}
function execSQL(sql){
  const res = db.exec(sql);
  if(!res || res.length===0) return {columns:[],values:[]};
  return res[res.length-1];
}
function normVal(v){
  if(v===null || v===undefined) return '\u0000NULL';
  if(typeof v==='number') return Number.isInteger(v) ? String(v) : String(Math.round(v*100)/100);
  if(v instanceof Uint8Array) return '[blob]';
  return String(v);
}
function normalize(res, ordered){
  const rows = res.values.map(r=>r.map(normVal));
  if(!ordered) rows.sort((a,b)=>JSON.stringify(a)<JSON.stringify(b)?-1:1);
  return {cols:res.columns.length, rows, colNames:res.columns};
}
function resultsEqual(a,b){
  if(a.cols!==b.cols || a.rows.length!==b.rows.length) return false;
  for(let i=0;i<a.rows.length;i++)
    for(let j=0;j<a.rows[i].length;j++)
      if(a.rows[i][j]!==b.rows[i][j]) return false;
  return true;
}
function getExpected(lessonId, idx){
  const key=lessonId+':'+idx;
  if(expectedCache[key]) return expectedCache[key];
  const l=findLesson(lessonId); const ex=l.exercises[idx];
  return expectedCache[key] = normalize(execSQL(ex.solution), !!ex.ordered);
}

let current = {lessonId:null, idx:0, hintsUsed:false, attempts:0};

function openLesson(lessonId){

function renderLesson(){

  let dots='';
  lesson.exercises.forEach((_,i)=>{

    else if(state.ex[current.lessonId+':'+i]!==undefined) cls+=' ok';

  });
  app.innerHTML = `

        <strong>Exercice ${current.idx+1} / ${total}</strong>
        <div class="ex-dots">${dots}</div>
      </div>

      <button class="speak-fab" data-speak="#prompt-text">🔊</button>
      <div class="editor-wrap" style="margin-top:14px">
        <div class="lineno" id="lineno">1</div>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" inputmode="text">${esc(ex.starter)}</textarea>
      </div>
      <div class="actions">
        <button class="btn btn-run" onclick="runOnly()">▶ Exécuter</button>
        <button class="btn btn-check" onclick="checkAnswer()">✓ Valider</button>
        <button class="btn btn-hint" onclick="showHint()">💡 Indice</button>
      </div>
      <div class="hintbox" id="hintbox"></div>
      <div class="feedback" id="feedback"></div>
      <div class="results" id="results"></div>
    </div>`;
  const ta=document.getElementById('editor');
  ta.focus();
  ta.addEventListener('input', updateLineNumbers);
  ta.addEventListener('keydown', e=>{
    if(e.key==='Tab'){
      e.preventDefault();
      const s=ta.selectionStart, ep=ta.selectionEnd;
      ta.value = ta.value.slice(0,s)+'  '+ta.value.slice(ep);
      ta.selectionStart = ta.selectionEnd = s+2;
      updateLineNumbers();
    }
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); checkAnswer(); }
  });
  updateLineNumbers();
  updateTopbar();
  setTimeout(()=>{ if(state.tts && ttsUnlocked) speak(ex.prompt); }, 250);
}
function updateLineNumbers(){
  const ta=document.getElementById('editor'), ln=document.getElementById('lineno');
  if(!ta||!ln) return;
  const n=ta.value.split('\n').length;
  ln.innerHTML = Array.from({length:n},(_,i)=>i+1).join('<br>');
}
function showHint(){
  const l=findLesson(current.lessonId); const ex=l.exercises[current.idx];
  if(!ex.hint) return;
  const box=document.getElementById('hintbox');
  box.textContent='💡 '+ex.hint; box.classList.add('show');
  current.hintsUsed=true;
  speak('Indice : '+ex.hint);
}
function renderResults(res){
  const box=document.getElementById('results');
  if(res.values.length===0 && res.columns.length===0){
    box.innerHTML=`<div class="results-bar"><span>Aucune ligne</span></div>`;
    box.classList.add('show'); return;
  }
  const shown=res.values.slice(0,50);
  let html=`<div class="results-bar"><span>${res.values.length} ligne(s)</span>
    ${res.values.length>50?`<span>limité à 50</span>`:''}</div>
    <div class="table-scroll"><table><thead><tr>`;
  res.columns.forEach(c=> html += `<th>${esc(c)}</th>`);
  html += `</tr></thead><tbody>`;
  shown.forEach(row=>{
    html += '<tr>';
    row.forEach(v=>{
      const isNull = v===null || v===undefined;
      html += `<td class="${isNull?'null':''}">${isNull?'NULL':esc(normVal(v).replace('\u0000NULL','NULL'))}</td>`;
    });
    html += '</tr>';
  });
  html += `</tbody></table></div>`;
  box.innerHTML=html; box.classList.add('show');
}
function runOnly(){
  const sql=document.getElementById('editor').value.trim();
  const fb=document.getElementById('feedback'), box=document.getElementById('results');
  fb.className='feedback'; box.classList.remove('show');
  if(!sql){ showFb('err',"❌ Écris une requête d'abord."); return; }
  try{
    const res=execSQL(sql);
    renderResults(res);
    if(!res.values.length) showFb('info',"ℹ️ Aucune ligne retournée.");
  }catch(err){ showFb('err','❌ Erreur SQL : '+err.message); }
}
function showFb(type,msg){
  const fb=document.getElementById('feedback');
  fb.className='feedback show '+type; fb.innerHTML=msg;
}
function checkAnswer(){
  const sql=document.getElementById('editor').value.trim();
  const l=findLesson(current.lessonId); const ex=l.exercises[current.idx];
  const fb=document.getElementById('feedback'); fb.className='feedback';
  if(!sql){ showFb('err',"❌ Écris une requête d'abord."); return; }
  let userRes;
  try{ userRes=execSQL(sql); }
  catch(err){ showFb('err','❌ Erreur SQL : '+err.message); return; }
  renderResults(userRes);
  current.attempts++;
  const userNorm = normalize(userRes, !!ex.ordered);
  const expNorm = getExpected(current.lessonId, current.idx);
  if(resultsEqual(userNorm, expNorm)){
    const stars = current.hintsUsed ? (current.attempts===1?2:1) : (current.attempts===1?3:2);
    const key = current.lessonId+':'+current.idx;
    const already = state.ex[key]!==undefined;
    if(!already){
      state.ex[key]=stars;
      state.xp += 10 + stars*5;
      touchStreak(); checkBadges(); saveState(); updateTopbar();
    }
    showFb('ok',`🎉 <b>Bravo !</b> ${'★'.repeat(stars)}${'☆'.repeat(3-stars)} — +${already?0:10+stars*5} XP`);
    speak(current.attempts===1?'Bravo, parfait !':'Bravo !');
    document.querySelector('.actions').innerHTML = `<button class="btn btn-next" onclick="nextExercise()">Continuer →</button>`;
    const ta=document.getElementById('editor'); ta.disabled=true; ta.style.opacity='.65';
  }else{
    let msg="❌ Ce n'est pas encore ça.";
    if(userNorm.cols!==expNorm.cols) msg += ` Tu renvoies ${userNorm.cols} colonne(s), il en faut ${expNorm.cols}.`;
    else if(userNorm.rows.length!==expNorm.rows.length) msg += ` Tu renvoies ${userNorm.rows.length} ligne(s), il en faut ${expNorm.rows.length}.`;
    else msg += ' Même nombre de lignes, valeurs différentes.';
    showFb('err', msg);
    speak("Ce n'est pas encore ça. Réessaie.");
  }
}
function nextExercise(){
  const l=findLesson(current.lessonId);
  if(current.idx < l.exercises.length-1){
    current.idx++; current.hintsUsed=false; current.attempts=0;
    renderLesson();
  }else finishLesson();
}
function finishLesson(){
  const l=findLesson(current.lessonId);
  const stars=lessonStars(current.lessonId);
  const prev=state.lessons[l.id];
  if(!prev || prev.stars < stars){ state.lessons[l.id]={stars,completedAt:Date.now()}; saveState(); }
  checkBadges();
  app.innerHTML = `<div class="complete">
    <div class="big">🏁</div>
    <h2>Leçon terminée !</h2>
    <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p>${l.title}</p>
    <button class="btn btn-check" onclick="renderHome()">Retour</button>
  </div>`;
  speak('Leçon terminée ! Félicitations.');
  updateTopbar();
}

    <div class="theory">
      <h3>✏️ Travaux pratiques</h3>
      <p style="color:var(--muted);font-size:.85rem;margin-bottom:16px">Fais chaque TP, puis clique "Solution" pour vérifier.</p>
      <div id="tp-list">`;
  ch.tps.forEach((tp,i)=>{
    const tpKey = ch.id+':'+i;
    const done = !!state.academy[tpKey];
    html += `<div class="tp-item ${done?'done':''}" id="tp-${tpKey}">
      <div class="tp-head">
        <div class="tp-check ${done?'done':''}" onclick="toggleTpDone('${tpKey}')" title="Marquer comme fait">✓</div>
        <div class="tp-prompt"><strong>TP ${i+1}.</strong> ${tp.prompt}</div>
      </div>
      <div class="tp-actions">
        <button class="btn btn-hint" onclick="toggleTpHint('${tpKey}')">💡 Indice</button>
        <button class="btn btn-run" onclick="toggleTpSolution('${tpKey}')">👁 Solution</button>
      </div>
      <div class="tp-hintbox" id="hint-${tpKey}">💡 ${esc(tp.hint||'')}</div>
      <div class="tp-solution" id="sol-${tpKey}">${esc(tp.solution)}</div>
    </div>`;
  });
  html += `</div></div>`;
  app.innerHTML = html;
  updateTopbar();
  setTimeout(()=>{ if(state.tts && ttsUnlocked) speak(ch.title + '. ' + ch.summary); }, 300);
}
function toggleTpDone(tpKey){
  if(state.academy[tpKey]){
    delete state.academy[tpKey];
    state.xp = Math.max(0, state.xp - 15);
  }else{
    state.academy[tpKey] = true;
    state.xp += 15;
    touchStreak();
    checkBadges();
    toast('✅ +15 XP');
  }
  saveState();
  const el = document.getElementById('tp-'+tpKey);
  if(el){
    const done = !!state.academy[tpKey];
    el.classList.toggle('done', done);
    const check = el.querySelector('.tp-check');
    if(check) check.classList.toggle('done', done);
  }
  updateTopbar();
}
function toggleTpHint(tpKey){
  const el = document.getElementById('hint-'+tpKey);
  if(el) el.classList.toggle('show');
}
function toggleTpSolution(tpKey){
  const el = document.getElementById('sol-'+tpKey);
  if(el) el.classList.toggle('show');
}

/* =========================================================
   ARCADE
   ========================================================= */
let game=null;
function renderArcade(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  let html = `<button class="back" onclick="renderHome()">← Carte</button>
    <div class="hero" style="margin-bottom:24px">
      <h1>🎮 <em>Arcade</em></h1>
      <p>Quatre mini-jeux. Questions lues à voix haute.</p>
    </div>`;
  Object.entries(ARCADE).forEach(([id,g])=>{
    const best = state.scores[id]||0;
    const isTime = id==='speed';
    html += `<div class="world">
      <div class="world-head">
        <div class="world-emoji">${g.emoji}</div>
        <div><div class="world-title">${g.name}</div>
        <div class="world-desc">${g.desc}</div></div>
        <div class="world-prog">Record<br><b>${best}${isTime?'':'/'+g.data.length}</b></div>
      </div>
      <button class="btn btn-check" onclick="startGame('${id}')" style="margin-top:16px;width:100%">Jouer →</button>
    </div>`;
  });
  app.innerHTML = html;
  updateTopbar();
}
function startGame(id){
  if(id==='speed'){
    game = {type:'speed',id,score:0,idx:0,pool:shuffle([...ARCADE.speed.data]),timeLeft:60,answered:false};
    renderSpeedGame();
    game.timer = setInterval(()=>{
      game.timeLeft--;
      if(game.timeLeft<=0) endGame();
      else if(game.timeLeft<=10) updateSpeedTimer();
    }, 1000);
  }else{
    game = {type:id,id,score:0,idx:0,total:ARCADE[id].data.length,answered:false};
    renderArcadeQuestion();
  }
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function renderArcadeQuestion(){
  const g = ARCADE[game.id];
  const q = g.data[game.idx];
  game.answered = false;
  let dots='';
  g.data.forEach((_,i)=>{
    let cls='dot';
    if(i===game.idx) cls+=' cur';
    else if(i<game.idx) cls+=' ok';
    dots+=`<div class="${cls}"></div>`;
  });
  const qText = q.q || "Quel est le résultat de cette requête ?";
  const qBody = q.sql ? `<div class="quiz-sql" id="quiz-sql">${esc(q.sql)}</div>` : '';
  app.innerHTML = `<button class="back" onclick="quitGame()">← Arcade</button>
    <div class="theory">
      <div class="ex-head"><strong>${game.idx+1} / ${g.data.length}</strong>
      <div class="ex-dots">${dots}</div></div>
      <div class="prompt" id="qtext">${esc(qText)}</div>
      <button class="speak-fab" data-speak="#full-q">🔊</button>
      <div id="full-q" style="display:none">${esc(qText)} ${q.sql?'. Requête : '+esc(q.sql):''}</div>
      ${qBody}
      <div id="opts">${q.opts.map((o,i)=>`<button class="opt-btn" onclick="answerArcade(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>
      <div class="feedback" id="arcade-fb"></div>
    </div>`;
  updateTopbar();
  setTimeout(()=>{ if(state.tts && ttsUnlocked) speak(qText + (q.sql?'. '+q.sql:'')); }, 200);
}
function answerArcade(pick){
  if(game.answered) return;
  game.answered=true;
  const g = ARCADE[game.id], q = g.data[game.idx];
  const btns = document.querySelectorAll('.opt-btn'), fb = document.getElementById('arcade-fb');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a) b.classList.add('correct');
    if(i===pick && pick!==q.a) b.classList.add('wrong');
  });
  if(pick===q.a){
    game.score++;
    state.xp += g.xpPer;
    fb.className='feedback show ok';
    fb.innerHTML = `✅ <b>Bonne réponse !</b> +${g.xpPer} XP<br><span style="opacity:.85;font-size:.88em">${esc(q.exp)}</span>`;
    speak('Bonne réponse. '+q.exp);
  }else{
    fb.className='feedback show err';
    fb.innerHTML = `❌ La bonne réponse était <b>${String.fromCharCode(65+q.a)}</b>.<br><span style="opacity:.85;font-size:.88em">${esc(q.exp)}</span>`;
    speak('Raté. La bonne réponse était '+q.opts[q.a]+'. '+q.exp);
  }
  saveState(); updateTopbar();
  setTimeout(()=>{
    game.idx++;
    if(game.idx >= g.data.length) endGame();
    else renderArcadeQuestion();
  }, 2400);
}
function renderSpeedGame(){
  const q = game.pool[0];
  const qText = q.q || "Quel est le résultat ?";
  const qBody = q.sql ? `<div class="quiz-sql">${esc(q.sql)}</div>` : '';
  app.innerHTML = `<button class="back" onclick="quitGame()">← Arcade</button>
    <div class="theory">
      <div class="ex-head"><strong>Score : ${game.score}</strong>
      <div class="timer" id="timer">⏱ ${game.timeLeft}s</div></div>
      <div class="prompt">${esc(qText)}</div>
      <div id="full-q" style="display:none">${esc(qText)} ${q.sql?'. '+esc(q.sql):''}</div>
      ${qBody}
      <div id="opts">${q.opts.map((o,i)=>`<button class="opt-btn" onclick="answerSpeed(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>
      <div class="feedback" id="arcade-fb"></div>
    </div>`;
  updateTopbar();
  setTimeout(()=>{ if(state.tts && ttsUnlocked) speak(qText + (q.sql?'. '+q.sql:''), {rate:1.1}); }, 150);
}
function updateSpeedTimer(){
  const t = document.getElementById('timer');
  if(t){ t.textContent = '⏱ '+game.timeLeft+'s'; if(game.timeLeft<=10) t.classList.add('warn'); }
}
function answerSpeed(pick){
  if(!game || game.answered) return;
  game.answered=true;
  const q = game.pool[0];
  const btns = document.querySelectorAll('.opt-btn'), fb = document.getElementById('arcade-fb');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a) b.classList.add('correct');
    if(i===pick && pick!==q.a) b.classList.add('wrong');
  });
  if(pick===q.a){
    game.score++;
    state.xp += ARCADE.speed.xpPer;
    fb.className='feedback show ok'; fb.textContent = `✅ +${ARCADE.speed.xpPer} XP`;
  }else{
    fb.className='feedback show err'; fb.textContent = `❌ Bonne réponse : ${String.fromCharCode(65+q.a)}`;
  }
  updateTopbar(); saveState();
  setTimeout(()=>{
    if(game.timeLeft<=0) return;
    game.pool.shift();
    if(!game.pool.length) game.pool = shuffle([...ARCADE.speed.data]);
    game.answered=false;
    renderSpeedGame();
  }, 700);
}
function endGame(){
  if(!game) return;
  if(game.timer){ clearInterval(game.timer); game.timer=null; }
  const g = ARCADE[game.id];
  const best = state.scores[game.id]||0;
  const newBest = game.score > best;
  if(newBest){ state.scores[game.id] = game.score; saveState(); }
  checkBadges();
  const max = game.id==='speed' ? '∞' : g.data.length;
  const pct = game.id==='speed' ? Math.min(100, game.score*5) : Math.round(game.score/g.data.length*100);
  app.innerHTML = `<div class="complete">
    <div class="big">${game.score>0?'🎉':'💪'}</div>
    <h2>${g.name} terminé !</h2>
    <div class="score-big">${game.score} / ${max}</div>
    <p>${pct}% de réussite${newBest?' · <b style="color:var(--gold)">🎯 Nouveau record !</b>':''}</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-check" onclick="startGame('${game.id}')">Rejouer</button>
      <button class="btn btn-run" onclick="renderArcade()">← Arcade</button>
    </div></div>`;
  speak(`Partie terminée. Score ${game.score} sur ${max}.`);
  updateTopbar();
}
function quitGame(){
  if(game && game.timer){ clearInterval(game.timer); game.timer=null; }
  game = null;
  renderArcade();
}

/* =========================================================
   BADGES / SCHEMA / RESET
   ========================================================= */
function checkBadges(){
  BADGES.forEach(b=>{
    if(!state.badges.includes(b.id) && b.check(state)){
      state.badges.push(b.id);
      toast(`${b.icon} Badge débloqué : ${b.name}`);
    }
  });
  saveState();
}
function showSchema(){
  const schema = `CREATE TABLE products (
  id INTEGER PRIMARY KEY, name TEXT, category TEXT, price REAL, stock INTEGER
);
CREATE TABLE customers (
  id INTEGER PRIMARY KEY, name TEXT, city TEXT, country TEXT
);
CREATE TABLE orders (
  id INTEGER PRIMARY KEY, customer_id INTEGER, product_id INTEGER,
  quantity INTEGER, order_date TEXT
);`;
  const div = document.createElement('div');
  div.className = 'modal-bg';
  div.onclick = e => { if(e.target===div) div.remove(); };
  div.innerHTML = `<div class="modal">
    <h3>📋 Schéma</h3>
    <pre>${esc(schema)}</pre>
    <p style="color:var(--muted);font-size:.85rem">15 produits · 13 clients · 30 commandes</p>
    <button class="btn btn-run" onclick="this.closest('.modal-bg').remove()">Fermer</button>
  </div>`;
  document.body.appendChild(div);
}
function resetProgress(){
  if(!confirm('Effacer toute ta progression ?')) return;
  localStorage.removeItem(SAVE_KEY);
  state = loadState();
  expectedCache = {};
  renderHome();
  toast('Progression réinitialisée');
}

/* =========================================================
   BOOT
   ========================================================= */
(async function boot(){
  initTTS();
  try{
    await initDB();
    CURRICULUM.forEach(w=>w.lessons.forEach(l=>l.exercises.forEach((_,i)=>{
      try{ getExpected(l.id, i); }catch(e){ console.error('Solution invalide', l.id, i, e); }
    })));
    document.getElementById('loader').style.display = 'none';
    updateTopbar();
    renderHome();
  }catch(err){
    document.getElementById('loader').innerHTML =
      `<p style="color:#dc2626">❌ Impossible de charger le moteur SQL.<br>${esc(err.message)}</p>
       <p style="color:#64748b;font-size:.8rem;margin-top:10px">Vérifie ta connexion internet.</p>`;
  }
})();
</script>
